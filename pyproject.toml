[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-edge-compression"
version = "0.1.0"
description = "Research scaffold for compressing LLMs and packaging them for edge devices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "rich>=13.7",
  "huggingface_hub>=0.23",
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.41",
  "fastapi>=0.95",
  "python-multipart>=0.0.9",
  "uvicorn>=0.22",
  "typer>=0.12",
  "pyyaml>=6.0",
  "gunicorn>=20.1",
]

[project.scripts]
llm-edge-compression = "llm_edge_compression.cli:main"
llm-edge-server = "llm_edge_compression.server:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
